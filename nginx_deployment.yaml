apiVersion: v1
kind: Namespace
metadata:
  name: my-app-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: my-app-ns
  labels:
    app.kubernetes.io/name: my-app
    app.kubernetes.io/component: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
  template:
    metadata:
      annotations:
          prometheus.io/scrape: 'true'
          prometheus.io/port: '9113'
      labels:
        app.kubernetes.io/name: my-app
        app.kubernetes.io/component: nginx
    spec:
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "prometheus"
        effect: "NoSchedule"
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "128Mi"
              cpu: "50m"
            requests:
              cpu: "25m"
              memory: "64Mi"
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter
          resources:
            limits:
              memory: "128Mi"
              cpu: "50m"
            requests:
              cpu: "25m"
              memory: "64Mi"
          ports:
            - containerPort: 9113
---
apiVersion: v1
kind: Service
metadata:
  name: my-app
  namespace: my-app-ns
  labels:
    app.kubernetes.io/name: my-app
spec:
  selector:
    app.kubernetes.io/name: my-app
  ports:
    - name: nginx
      protocol: TCP
      port: 80
      targetPort: 80
    - name: exporter
      protocol: TCP
      port: 9113
      targetPort: 9113
